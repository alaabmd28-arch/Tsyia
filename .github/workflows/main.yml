name: Build APK + AAB
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Check signing secrets
        env:
          TASYIR_STORE_PASSWORD: ${{ secrets.TASYIR_STORE_PASSWORD }}
        run: |
          if [ -z "$TASYIR_STORE_PASSWORD" ]; then
            echo "::error::Missing GitHub secret TASYIR_STORE_PASSWORD (and TASYIR_KEY_PASSWORD). Release would be unsigned and could not update installed apps."
            exit 1
          fi
      - name: Build release APK and AAB
        env:
          TASYIR_STORE_PASSWORD: ${{ secrets.TASYIR_STORE_PASSWORD }}
          TASYIR_KEY_PASSWORD: ${{ secrets.TASYIR_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in *unsigned*) echo "::error::Unsigned APK produced: $f"; exit 1;; esac
            "$APKSIGNER" verify --verbose "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Tasyir-bmd-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
